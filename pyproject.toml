[project]
name = "bet-coupon-agent"
version = "0.1.0"
description = "Telegram screenshot to Olimpbet coupon browser agent"
requires-python = ">=3.10"
dependencies = [
  "playwright>=1.50,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
bet-agent = "bet_agent.main:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

